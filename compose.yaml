name: comakers
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: comakers_db
      MYSQL_USER: comakers_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run the init-env script first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run the init-env script first}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u comakers_user comakers_db -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  api:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/comakers_db
      DB_USERNAME: comakers_user
      DB_PASSWORD: ${DB_PASSWORD:?Run the init-env script first}
      JWT_SECRET: ${JWT_SECRET:?Run the init-env script first}
      SHOW_SQL: "false"
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s
volumes:
  mysql-data:
