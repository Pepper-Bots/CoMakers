spring.application.name=CoMakers

# Connexion à MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/comakers_db
spring.datasource.username=comakers_user
spring.datasource.password=${DB_PASSWORD}

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Base64-encoded random signing key, supplied by the execution environment.
comakers.jwt.secret=${JWT_SECRET}
