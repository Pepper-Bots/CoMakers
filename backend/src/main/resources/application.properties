spring.application.name=CoMakers

# Connexion à MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/comakers_db}
spring.datasource.username=${DB_USERNAME:comakers_user}
spring.datasource.password=${DB_PASSWORD}

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# Base64-encoded random signing key, supplied by the execution environment.
comakers.jwt.secret=${JWT_SECRET}

server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
